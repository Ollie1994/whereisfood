# Dependabot version updates for the GitHub Actions the workflows pin (Phase 8 plan step 15,
# IS #300): each `uses:` is pinned to a commit SHA with its version in a comment, and a
# Dependabot PR moves both. No `pull-request-branch-name`, so the separator is the default
# `/` and the branches should start `dependabot/`, which Vercel's Ignored Build Step cancels
# (plan #15, README "Preview deploys", seen there on a hand-pushed `dependabot/` branch);
# #300 reads the name and the cancel on the first Dependabot PR. No auto-merge: a Dependabot
# PR is reviewed like any other, and its diff is a change to what the checks run (CLAUDE.md,
# "Testing"); its commit message, release notes included, is scanned by `secret-scan` too.
#
# - `groups`: every action in one PR a week. Each such PR edits a workflow, ci.yml among them
#   a `TRIGGERS` path, so it runs the full controls (round 1 on PR #362).
# - `cooldown`: a release is proposed only once it is 7 days old, so a compromised one has
#   time to be pulled first (the owner's call, round 1 on PR #362). Version updates only.
# - `labels: []`: none of Dependabot's default labels (the repo's PR label rule).
#
# No npm entry: npm gets security updates only, from the repository setting (plan #2). Its
# updater image runs Node 24 (dependabot-core's npm_and_yarn/Dockerfile, read 2026-11-16)
# against `devEngines`'s `26.x`, but its lockfile commands pass `--force`, under which npm only
# warns EBADDEVENGINES (probed on PR #362 on npm 11.21, not the image's npm 12).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
    labels: []
