# Dependabot version updates for the GitHub Actions the workflows pin (Phase 8 plan step 15,
# IS #300): each `uses:` is pinned to a commit SHA with its version in a comment, and a
# Dependabot PR moves both. No `pull-request-branch-name`, so the separator is the default
# `/` and the branches should start `dependabot/`, which Vercel's Ignored Build Step cancels
# (plan #15, README "Preview deploys", seen there on a hand-pushed `dependabot/` branch);
# #300 reads the name and the cancel on the first Dependabot PR. No auto-merge: a Dependabot
# PR is reviewed like any other, and its diff is a change to what the checks run (CLAUDE.md,
# "Testing"); its commit message, release notes included, is scanned by `secret-scan` too,
# and a false find there is settled as CLAUDE.md's "Secrets" says: a `.gitleaks.toml` entry
# naming why, by its own PR into dev (the PR's copy is what runs), then `@dependabot rebase`.
#
# - `groups`: the week's minor and patch version updates in one PR. A major bump comes as
#   its own PR, and so does a security update, which groups don't cover by default. A PR
#   that moves an action ci.yml pins edits a `TRIGGERS` path and runs the full controls; one
#   that moves only codeql-action edits codeql.yml and runs `--check`.
# - `cooldown`: a release is proposed only once it is 7 days old, so a compromised one has
#   time to be pulled first (the owner's call, round 1 on PR #362). Version updates only
#   (GitHub's docs, "cooldown").
# - No `labels`: Dependabot adds its defaults, `dependencies` and `github_actions`.
#   `labels: []` didn't stop them on PR #366, and the owner allows them on Dependabot PRs.
#
# No npm entry: npm gets security updates only, from the repository setting (plan #2). Its
# updater image runs Node 24 (dependabot-core's npm_and_yarn/Dockerfile, read 2026-11-16)
# against `devEngines`'s `26.x`, but its lockfile commands pass `--force`, under which npm only
# warns EBADDEVENGINES (probed on PR #362, npm 11.21 and the image's npm 12.2.0). Its
# peer-dependency check runs without `--force`, fails, and is read as no conflicts, so a
# peer conflict reaches the lockfile and turns CI's `npm ci` red (ERESOLVE, probed there).
# A security PR for `next` moves `next` alone: add `eslint-config-next` and run the `/map`
# check before merging (CLAUDE.md, "Dependencies").
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    cooldown:
      default-days: 7
