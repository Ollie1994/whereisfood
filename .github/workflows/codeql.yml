# CodeQL on every PR into dev or main and every push to them (Phase 8 plan step 8, IS #294).
# Plan #2 counts on it to scan Dependabot and fork PRs. On Dependabot's first, PR #366, both
# analyze jobs succeeded and `CodeQL` posted ("No new alerts"); no fork PR has run it yet.
# `CodeQL` and both analyze jobs are required on `dev` and, since IS #461, on `main`;
# neither ruleset has a bypass list: if a job fails or `CodeQL` never posts on such a PR,
# the PR can't merge until that changes or the rule is lifted by hand. The push runs give a
# PR its base analysis to compare with; `main` had none until IS #461's merge (plan #11;
# Phase 10 plan #9). The same pull-request trigger as ci.yml, so a PR retargeted to dev or
# main gets no new run until its next push or a close and reopen (ci.yml's header). With
# CodeQL's checks in `main`'s ruleset, ci.yml's `base (main)` makes a PR retargeted from dev
# wait for a ci.yml run against main (IS #356), but shows nothing about CodeQL's checks:
# `CodeQL` posts after its upload, so until then its newest result may be from a run against
# dev (CLAUDE.md, "Testing", has the general case: which run each check came from).
#
# The analyze jobs finish green when they find something: a PR's verdict is the separate
# code-scanning result check GitHub posts from the uploaded results, named `CodeQL` (app
# github-advanced-security). Its findings get their own issues (plan #4). On probe PR #327
# it went red on `eval` of query input (critical), and on a
# `${{ github.event.pull_request.title }}` run line under `pull_request_target` only once
# the probe workflow's token had `contents: write`: with `contents: read` (both set at
# workflow level) the default queries passed it. It reads success while only one analysis
# has uploaded, stayed success on PR #326 when the JavaScript job was cancelled, and once
# ended neutral on "Error when processing the SARIF file". So both rulesets require
# `CodeQL` and both analyze jobs by name (plan #14, settled in #297; `main`'s since IS #461).
# The job's `name:` pattern and the matrix's `language` values make those names: changing
# either leaves both rulesets waiting on the old ones. A SARIF error with both
# jobs green still passes: GitHub's docs count a neutral check as passing.
#
# Hardening as in ci.yml (plan #2, Q5): the plain pull-request trigger, never its
# target-branch variant; every action pinned to a commit SHA; the workflow's token read-only,
# with only the analyze job given `security-events: write` to upload its results. No
# `actions: read`: GitHub's starter CodeQL workflow marks it "only required for workflows in
# private repositories", and this repository is public. CodeQL default setup is off (IS
# #284), as the plan requires: it conflicts with a workflow (plan, "Outside the repo").
name: codeql

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

# A new push to a PR cancels that PR's run still in progress. For a push, the group is the
# branch and cancel-in-progress is off: per GitHub's concurrency docs, one branch's runs then
# go one at a time, and a newer pending run cancels an older pending one. So a commit whose
# run is still waiting when a newer commit's run queues gets no analysis of its own, and the
# branch's latest analysis is its newest finished run's, older if that run failed. No push
# run before this file's merge, so none of this is seen yet.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # `actions` analyses the repository's GitHub Actions files: today only
        # .github/workflows/ (no action.yml or action.yaml is tracked). Neither needs a build.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
