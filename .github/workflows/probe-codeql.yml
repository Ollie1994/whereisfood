# Probe for IS #294, never merged: the PR title in a run line (actions/code-injection).
# pull_request_target runs from the base branch's copy, which has no such file, so it never runs.
name: probe-codeql
on: pull_request_target
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "${{ github.event.pull_request.title }}"
