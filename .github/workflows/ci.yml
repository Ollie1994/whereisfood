# The four gates, run by GitHub on every PR into dev or main (Phase 8 plan step 2, IS #285
# and #286), with a smoke check of the served build and, in `integration`, Supabase's
# security advisor on the local schema (step 5, IS #290); and the process log's check and
# the schema controls' `--check`, with the full controls on a trigger path or a PR into
# main (step 3, IS #288). Not required checks until #297's rulesets; until then each PR still
# runs the four gates by hand (CLAUDE.md, "Testing").
#
# Hardening (plan #2, Q5): the plain pull-request trigger only, never its target-branch
# variant; a read-only token; every action pinned to a commit SHA; no path filter on the
# workflow (a required check that never runs never reports, and the PR waits on it).
#
# The default activity types (opened, synchronize, reopened) don't include a change of the
# PR's base, so a PR retargeted to dev or main gets no new run until its next push; the
# results of its last run stay on its head commit, tested against the old base (whether
# #297's rulesets count them for the new base: not probed; #298 probes it). So a PR
# retargeted from dev to main keeps the `controls` result its dev run left, which may be
# `--check` only, though every PR into main is meant to run the full set. `edited`
# would start a run, and would also rerun every job on each edit of the PR's title or
# body (GitHub's docs: `edited` fires on a change of the title, body or base branch).
name: ci

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

# A new push to a PR cancels that PR's run of this workflow still in progress. The group
# names the workflow: groups are shared across a repository's workflows, and codeql.yml (IS
# #294) and the planned sonarqube.yml run on PRs too (plan steps 8 and 9).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# `shell: bash` runs each step as `bash --noprofile --norc -eo pipefail {0}` (GitHub's docs,
# "jobs.<job_id>.steps[*].shell"), so a failed command on the left of a pipe fails the
# step; the default without it is `bash -e {0}`.
defaults:
  run:
    shell: bash

# The local Supabase services a job starts without: every one but db, auth, kong, rest and
# inbucket (Mailpit, which auth-routes.test.ts reads at 127.0.0.1:54324). With these
# excluded, a local `npm run test:all` gave the full stack's counts (supabase CLI 2.109.1,
# IS #285's PR). That CLI refused `analytics,functions,meta,storage` as names to exclude,
# though its --help lists them, with a WARNING and exit 0, leaving those containers
# running; it took the names below. So a CLI bump that renames one only warns.
env:
  SUPABASE_EXCLUDE: realtime,imgproxy,studio,edge-runtime,vector,logflare,postgres-meta,storage-api,supavisor

jobs:
  typecheck-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node from package.json's devEngines.runtime (setup-node v7.1.0's docs, "Node
      # version file"); its "Environment details" log group prints the Node and npm
      # versions. Its npm cache is on by default here (devEngines.packageManager is npm): a
      # run saves it under its PR's ref, so the PR's later pushes restore it, and npm ci
      # still checks each package against the lockfile's hashes. This workflow never runs
      # on dev, so it saves no cache there for a new PR's first run (IS #285's PR).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - id: install
        run: npm ci
      # Next's generated types (.next/types, and next-env.d.ts, which also loads Next's
      # ambient types) don't exist on a fresh checkout, and tsc checks route handlers
      # against them only when they do: in a clean worktree a
      # handler with non-Promise params passed `tsc --noEmit` (exit 0) and failed it after
      # `next typegen` (exit 2, TS2344 in .next/types/validator.ts) (IS #285's PR).
      - run: npx next typegen
      - run: npx tsc --noEmit
      # Lint runs after a failed typegen or tsc too, once `npm ci` succeeded, unless the run
      # was cancelled: on probe PR #333, tsc and lint were both red in one run (IS #324).
      # It needs no typegen output: with .next/ and next-env.d.ts moved aside, as on a fresh
      # checkout, `npm run lint` exited 0 (PR #334's round 1). A step added to this job after tsc needs this `if:` too, or a red
      # tsc skips it.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: npm ci
      - run: npm run test:run

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The security advisor's database URL, used by its self-test and its run below (IS
    # #325): the local stack, with pgrst.db_schemas set on the session (the advisor step's
    # comment says why).
    env:
      ADVISOR_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres?options=-c%20pgrst.db_schemas%3Dpublic%2Cgraphql_public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: npm ci
      # Its output prints the stack's keys. They're the CLI's shared defaults, not secrets:
      # the CLI says so under them ("API keys and JWT secrets are shared defaults"), and
      # this run's keys hashed the same as a local stack's (IS #285's PR).
      - id: stack
        run: npx supabase start -x "$SUPABASE_EXCLUDE"
      # tests/integration/setup.ts reads .env.local, and throws without it. The script
      # maps README's "3. Environment" table, writes each value quoted, and fails on a
      # missing or empty value or one a reader would change (its comments say which).
      - run: npx supabase status -o env | node scripts/write-env-local.mjs
      # Both projects, keeping test:all's checks: a project that collects zero files
      # fails, and RUNS must match the projects vitest.config.ts declares. So the unit
      # project runs here as well as in `unit`, and a failing unit test turns both jobs
      # red; the log's project label tells them apart.
      - run: npm run test:all
      # Supabase's security advisor on the local schema (plan step 5, IS #290): red on a
      # WARN or ERROR lint; `--level info` prints the INFO ones too (on IS #290's PR, two:
      # rls_enabled_no_policy on locations and trucks, the design). It runs after the tests
      # whenever the stack started, so a red test and a red lint both show in one run.
      # tests/integration/ holds no SQL, DDL or grant (grepped on IS #290's PR): it reaches
      # the stack through supabase-js and, in auth-routes.test.ts, fetch() of Mailpit and of
      # Auth's emailed link. After test:all, the advisor printed the same two INFO as before
      # it (run 43562854682, PR #322).
      # Not `--local`: CLI 2.109.1's copy of rls_disabled_in_public matches only the schemas
      # in `current_setting('pgrst.db_schemas')`, unset on the local database (six more of
      # its lints read that setting), so with `--local` a public table with RLS off and an
      # anon SELECT grant gave exit 0; with the setting passed on the session, as here,
      # that table gave ERROR and exit 1 (IS #290's PR, probe PR #321). ADVISOR_DB_URL's
      # port and schemas copy config.toml's [db] port and [api] schemas, and each advisor
      # line in this job is the same command, both checked by scripts/ci-advisor.test.mjs.
      # A CLI bump that changes how the lints read their schemas would leave this step green
      # and blind: the self-test before it shows whether it can still fail (IS #325). No step
      # timeout: it took 1 s on run 43563442098, and a hung connection waits for what is
      # left of the job's `timeout-minutes: 20`, which counts from the job's start (npm ci,
      # the stack and test:all ran first).
      #
      # The self-test: a public table with RLS off and an anon SELECT grant, which the
      # advisor's run must report as rls_disabled_in_public and exit 1 on; the table is
      # dropped on the way out, whatever the result, before the real run.
      - name: Security advisor self-test
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: |
          trap 'psql "$ADVISOR_DB_URL" -q -c "drop table if exists public.advisor_canary"' EXIT
          psql "$ADVISOR_DB_URL" -q -v ON_ERROR_STOP=1 \
            -c "create table public.advisor_canary (id int primary key)" \
            -c "grant select on table public.advisor_canary to anon"
          set +e
          out="$(npx supabase db advisors --type security --level info --fail-on warn --local 2>&1)"
          code=$?
          set -e
          echo "::group::the advisor's output (exit $code)"; echo "$out"; echo "::endgroup::"
          if [ "$code" -ne 1 ] || ! grep -q '"rls_disabled_in_public_public_advisor_canary"' <<<"$out"; then
            echo "::error::the advisor didn't report the canary table (exit $code): it may be blind"
            exit 1
          fi
      - name: Security advisor
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: npx supabase db advisors --type security --level info --fail-on warn --db-url "$ADVISOR_DB_URL"

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: npm ci
      # Its own stack (IS #286, open decision 3): `next build` needs .env.local, since
      # src/lib/supabase.ts throws at import without its variables, and the smoke check's
      # /api/live reads the database.
      - run: npx supabase start -x "$SUPABASE_EXCLUDE"
      - run: npx supabase status -o env | node scripts/write-env-local.mjs
      - run: npm run build
      # `next start` serves the build; smoke.mjs checks five paths at the URL from the
      # server's own `Local:` line, once it has printed `Ready in` (CLAUDE.md, "Browser
      # checks: confirm which server answered"). A `next start` that can't bind prints
      # neither: with port 3000 already taken it printed `EADDRINUSE` and exited, and the
      # answers came from the other server (IS #286's PR). On a failure the server's log is
      # printed.
      - name: Serve the build and smoke-check it
        run: |
          npm start > next-start.log 2>&1 &
          server=$!
          # `kill -0` only ends the wait early; it doesn't decide the result. In Git Bash on
          # Windows it ended the wait after 1 s when `npm start` failed at once (a missing
          # script), and still passed for an `npm start` whose `next start` had exited with
          # `EADDRINUSE`; on this Ubuntu runner neither was probed. So the `Ready in` and
          # `Local:` lines decide (IS #286's PR).
          for _ in $(seq 1 60); do
            grep -q -e "Ready in" -e "Failed to start server" next-start.log && break
            kill -0 "$server" 2>/dev/null || break
            sleep 1
          done
          url="$(sed -n 's/^- Local: *\(http[^ ]*\).*/\1/p;T;q' next-start.log)"
          ok=true
          if grep -q "Ready in" next-start.log && [ -n "$url" ]; then
            node scripts/smoke.mjs "$url" || ok=false
          else
            echo "::error::next start printed no 'Ready in' and 'Local:' URL"
            ok=false
          fi
          if [ "$ok" != true ]; then
            echo "::group::next start's log"; cat next-start.log; echo "::endgroup::"
            exit 1
          fi

  # The schema controls (CLAUDE.md, "Schema controls"): every control file parsed on every
  # PR, and the full set, about 45 s a control, when scripts/controls-trigger.mjs says so (a
  # trigger path changed, or the PR is into main). Its own job and stack (open decision 3),
  # so `integration` keeps its 20-minute limit. With the stack started on SUPABASE_EXCLUDE,
  # five controls (red, setup-fails and green, across `schema`, `rls` and `db-trucks`) ran
  # as listed, their six `db reset`s with no excluded service started (IS #288's PR).
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # Depth 2: the merge commit and both its parents, which changedPaths diffs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # No npm cache here: `npm ci` runs only for the full set, and with the cache on, a
      # `--check`-only run saved an empty cache (670 B) under the key every job shares. It
      # finished first, so `unit`, `typecheck-lint` and `build` failed to save theirs
      # ("another job may be creating this cache") and `integration` restored the empty one
      # (probe PR #319, run 43443375088). The full set's install goes uncached.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - run: node scripts/controls.mjs --check
      # The script prints `true` or `false`, and exits 1 when it can't tell (the step then
      # fails: `-e` applies to the assignment). Imported rather than run, it would print
      # nothing and exit 0, so any other output fails here (PR #316, rounds 1 and 2).
      - name: Decide whether the full set runs
        id: trigger
        run: |
          full="$(node scripts/controls-trigger.mjs "$GITHUB_BASE_REF")"
          case "$full" in
            true | false) echo "full=$full" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::controls-trigger printed '$full', not true or false"; exit 1 ;;
          esac
      # The full set's steps. Each carries this `if:`: a step added here without it also runs
      # on a PR that doesn't take the full set, where there's no stack and no install.
      - if: steps.trigger.outputs.full == 'true'
        run: npm ci
      - if: steps.trigger.outputs.full == 'true'
        run: npx supabase start -x "$SUPABASE_EXCLUDE"
      - if: steps.trigger.outputs.full == 'true'
        run: npx supabase status -o env | node scripts/write-env-local.mjs
      - if: steps.trigger.outputs.full == 'true'
        run: node scripts/controls.mjs

  # The process log's own check (CLAUDE.md, "Process Log"): prints nothing and exits 0 on a
  # good log. Plain bash; no install. Two PRs that each add the next row number both pass
  # here, but the second to merge conflicts in the log (`process-log.sh add` inserts after
  # the last row; probed in a clone, IS #288's PR), and the update that resolves it reruns
  # this job.
  process-log:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/process-log.sh check
