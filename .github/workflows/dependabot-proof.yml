# TEMPORARY, for IS #300's proof (Phase 8 plan step 15; the owner's call on PR #364, which
# downgraded ci.yml instead and was closed for it). dependabot.yml's 7-day cooldown holds
# new releases, and every action ci.yml and codeql.yml pin was on its newest release on
# 2026-11-16, so no Dependabot PR could come for a week or more. This file pins
# actions/setup-node one release back (v7.0.0), so Dependabot can propose v7.1.0 now
# (published 2026-10-08, past the cooldown). It runs only when started by hand, and a hand
# run's result is no part of the proof; ci.yml keeps v7.1.0 and is untouched.
#
# Delete this file once Dependabot's PR for it has merged (IS #363's delete step).
name: dependabot-proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
