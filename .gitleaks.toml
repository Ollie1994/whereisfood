# Gitleaks config (IS #292). Both hooks in `.githooks/` and `ci.yml`'s `secret-scan` (IS
# #293) pass `--config .gitleaks.toml` (`gitleaks-common.sh` says why). The default rules,
# unchanged. The history scan that found nothing to allow is open decision 1's, in the
# Phase 8 plan.
#
# An allowlist entry added here names why its value isn't a secret. A `paths` entry
# reaches the scans of files, pre-commit and `secret-scan`'s patch scan, and not the
# scans of messages: commit-msg scans text with no path, and a `paths = ['.*']` entry
# still left it refusing a flagged message (exit 1). On a conflicted merge `secret-scan`
# names the file `b/<path>`: a `^f\.txt$` entry didn't match `b/f.txt` there, and
# `^(b/)?f\.txt$` matched both forms. A `regexes` entry reaches every scan (a temporary
# one let a flagged message through commit-msg, exit 0).
[extend]
useDefault = true
