# Gitleaks config (IS #292), read by the pre-commit hook and the CI scan. With no
# --config, Gitleaks reads `.gitleaks.toml` from the scanned folder's root
# (`gitleaks git --help`, 8.30.1).
#
# The default rules, unchanged: a full-history scan with them found 0 leaks in 887
# commits, every non-merge commit with a diff on every ref (8.30.1, 2026-11-15; no merge
# carried changes of its own).
#
# An allowlist entry added here names why its value isn't a secret.
[extend]
useDefault = true
